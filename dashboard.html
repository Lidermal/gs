<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestão de Viagens</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans">
    <nav class="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="Logo" class="h-8 bg-white rounded p-1">
            <h1 class="text-xl font-bold">Painel de Viagens</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="userGreeting" class="text-sm font-medium"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold transition">Sair</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Formulário de Registro -->
        <section class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2 mb-4">Registrar Horas</h2>
            <form id="tripForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Sigla da Loja (XXX)</label>
                        <input type="text" id="sigla" required maxlength="3" class="w-full uppercase px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Tipo de Viagem</label>
                        <select id="tipoProjeto" required class="w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                            <option value="Projeto">Projeto</option>
                            <option value="Suporte">Suporte</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600">Data do Trabalho</label>
                    <input type="date" id="dataTrabalho" required class="w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded border">
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Entrada</label>
                        <input type="time" id="hrEntrada" required class="w-full px-2 py-1 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Início Almoço</label>
                        <input type="time" id="hrInicioAlmoco" required class="w-full px-2 py-1 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Fim Almoço</label>
                        <input type="time" id="hrFimAlmoco" required class="w-full px-2 py-1 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Saída</label>
                        <input type="time" id="hrSaida" required class="w-full px-2 py-1 border rounded">
                    </div>
                </div>

                <button type="submit" id="btnSalvar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">
                    <span id="btnSalvarTexto">Salvar Registro</span>
                </button>
                <div id="msgSalvar" class="text-center text-sm font-medium hidden"></div>
            </form>
        </section>

        <!-- Relatórios -->
        <section class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
                <h2 class="text-lg font-bold text-slate-700 border-b pb-2 mb-4">Relatório 1: Horas e Extras</h2>
                <table class="w-full text-sm text-left border-collapse">
                    <thead class="bg-slate-100 text-slate-600">
                        <tr>
                            <th class="p-2 border">Data</th>
                            <th class="p-2 border">Loja</th>
                            <th class="p-2 border">Escala Aplicada</th>
                            <th class="p-2 border text-center">Horas Feitas</th>
                            <th class="p-2 border text-center text-blue-600">Horas Extras</th>
                        </tr>
                    </thead>
                    <tbody id="tbHoras" class="text-slate-700">
                        <tr><td colspan="5" class="p-4 text-center">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
                <h2 class="text-lg font-bold text-slate-700 border-b pb-2 mb-4">Relatório 2: Financeiro de Viagens</h2>
                <table class="w-full text-sm text-left border-collapse">
                    <thead class="bg-slate-800 text-white">
                        <tr>
                            <th class="p-2 border">Data</th>
                            <th class="p-2 border">Loja</th>
                            <th class="p-2 border text-center">Extras (h)</th>
                            <th class="p-2 border text-right">Valor/Hora (R$)</th>
                            <th class="p-2 border text-right text-green-400">Total Previsto (R$)</th>
                        </tr>
                    </thead>
                    <tbody id="tbFinanceiro" class="text-slate-700">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="dashboard.js"></script>
</body>
</html>
