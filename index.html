<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Viagens</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- CDNs Solicitados (Tailwind, Bootstrap, Bootswatch, AdminLTE) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/flatly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md fade-in" id="mainCard">
        
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <img src="logo.png" alt="Logo" class="h-20 object-contain" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
        </div>

        <!-- TELA DE LOGIN -->
        <div id="loginSection">
            <h2 class="text-2xl font-bold text-slate-700 text-center mb-6">Acesso ao Sistema</h2>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600">Usuário (nome.sobrenome)</label>
                    <input type="text" id="loginUser" required placeholder="ex: joao.silva" 
                           class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 lowercase">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">Senha</label>
                    <input type="password" id="loginSenha" required 
                           class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                    <span id="loginText">Entrar</span>
                </button>
                <div id="loginMsg" class="text-center text-sm font-medium mt-2 hidden"></div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-600">Primeiro acesso?</p>
                <button onclick="toggleView('register')" class="text-blue-600 hover:underline font-semibold mt-1">Crie sua conta aqui</button>
            </div>
        </div>

        <!-- TELA DE PRIMEIRO ACESSO (CADASTRO) -->
        <div id="registerSection" class="hidden">
            <h2 class="text-2xl font-bold text-slate-700 text-center mb-6">Primeiro Acesso</h2>
            
            <form id="registerForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Nome</label>
                        <input type="text" id="regNome" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Sobrenome</label>
                        <input type="text" id="regSobrenome" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-600">Equipe</label>
                    <select id="regEquipe" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Selecione...</option>
                        <option value="Anna">Equipe da Anna</option>
                        <option value="Didi">Equipe do Didi</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600">Nível de Suporte</label>
                    <select id="regNivel" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Selecione...</option>
                        <option value="Suporte NN">Suporte NN</option>
                        <option value="Suporte N1">Suporte N1</option>
                        <option value="Suporte N2">Suporte N2</option>
                        <option value="Suporte N3">Suporte N3</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600">Crie uma Senha</label>
                    <input type="password" id="regSenha" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>

                <button type="submit" id="btnRegister" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-4 rounded-lg transition duration-200 mt-2">
                    <span id="regText">Cadastrar</span>
                </button>
                <div id="regMsg" class="text-center text-sm font-medium mt-2 hidden"></div>
            </form>

            <div class="mt-6 text-center">
                <button onclick="toggleView('login')" class="text-slate-500 hover:text-slate-700 font-semibold text-sm">Voltar para o Login</button>
            </div>
        </div>
    </div>

    <!-- Script Customizado -->
    <script src="script.js"></script>
</body>
</html>
