<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Viagens</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- CDNs Solicitados (Tailwind e Bootstrap/Themes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/flatly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- ========================================== -->
    <!-- MÓDULO 1: AUTENTICAÇÃO (LOGIN / CADASTRO)  -->
    <!-- ========================================== -->
    <div id="authView" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md" id="mainCard">
            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <img src="logo.png" alt="Logo" class="h-20 object-contain" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
            </div>

            <!-- TELA DE LOGIN -->
            <div id="loginSection">
                <h2 class="text-2xl font-bold text-slate-700 text-center mb-6">Acesso ao Sistema</h2>
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Usuário (nome.sobrenome)</label>
                        <input type="text" id="loginUser" required placeholder="ex: joao.silva" class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 lowercase">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Senha</label>
                        <input type="password" id="loginSenha" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                        <span id="loginText">Entrar</span>
                    </button>
                    <div id="loginMsg" class="text-center text-sm font-medium mt-2 hidden"></div>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-sm text-slate-600">Primeiro acesso?</p>
                    <button onclick="toggleAuthView('register')" class="text-blue-600 hover:underline font-semibold mt-1">Crie sua conta aqui</button>
                </div>
            </div>

            <!-- TELA DE PRIMEIRO ACESSO (CADASTRO) -->
            <div id="registerSection" class="hidden">
                <h2 class="text-2xl font-bold text-slate-700 text-center mb-6">Primeiro Acesso</h2>
                <form id="registerForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600">Nome</label>
                            <input type="text" id="regNome" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600">Sobrenome</label>
                            <input type="text" id="regSobrenome" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Equipe</label>
                        <select id="regEquipe" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Selecione...</option>
                            <option value="Anna">Equipe da Anna</option>
                            <option value="Didi">Equipe do Didi</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Nível de Suporte</label>
                        <select id="regNivel" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Selecione...</option>
                            <option value="Suporte NN">Suporte NN</option>
                            <option value="Suporte N1">Suporte N1</option>
                            <option value="Suporte N2">Suporte N2</option>
                            <option value="Suporte N3">Suporte N3</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600">Crie uma Senha</label>
                        <input type="password" id="regSenha" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit" id="btnRegister" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-4 rounded-lg transition duration-200 mt-2">
                        <span id="regText">Cadastrar</span>
                    </button>
                    <div id="regMsg" class="text-center text-sm font-medium mt-2 hidden"></div>
                </form>
                <div class="mt-6 text-center">
                    <button onclick="toggleAuthView('login')" class="text-slate-500 hover:text-slate-700 font-semibold text-sm">Voltar para o Login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MÓDULO 2: DASHBOARD (SUBPÁGINA OCULTA)     -->
    <!-- ========================================== -->
    <div id="dashboardView" class="hidden">
        <nav class="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="h-8 bg-white rounded p-1" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
                <h1 class="text-xl font-bold">Painel de Viagens</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="userGreeting" class="text-sm font-medium"></span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold transition">Sair</button>
            </div>
        </nav>

        <main class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Formulário de Registro -->
            <section class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md h-fit">
                <h2 class="text-lg font-bold text-slate-700 border-b pb-2 mb-4">Registrar Horas</h2>
                <form id="tripForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Sigla da Loja (XXX)</label>
                            <input type="text" id="sigla" required maxlength="3" class="w-full uppercase px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Tipo de Viagem</label>
                            <select id="tipoProjeto" required class="w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                                <option value="Projeto">Projeto</option>
                                <option value="Suporte">Suporte</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600">Data do Trabalho</label>
                        <input type="date" id="dataTrabalho" required class="w-full px-3 py-2 border rounded focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded border">
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Entrada</label>
                            <input type="time" id="hrEntrada" required class="w-full px-2 py-1 border rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Início Almoço</label>
                            <input type="time" id="hrInicioAlmoco" required class="w-full px-2 py-1 border rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Fim Almoço</label>
                            <input type="time" id="hrFimAlmoco" required class="w-full px-2 py-1 border rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600">Saída</label>
                            <input type="time" id="hrSaida" required class="w-full px-2 py-1 border rounded">
                        </div>
                    </div>
                    <button type="submit" id="btnSalvar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">
                        <span id="btnSalvarTexto">Salvar Registro</span>
                    </button>
                    <div id="msgSalvar" class="text-center text-sm font-medium hidden"></div>
                </form>
            </section>

            <!-- Relatórios -->
            <section class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
                    <h2 class="text-lg font-bold text-slate-700 border-b pb-2 mb-4">Relatório 1: Horas e Extras</h2>
                    <table class="w-full text-sm text-left border-collapse">
                        <thead class="bg-slate-100 text-slate-600">
                            <tr>
                                <th class="p-2 border">Data</th>
                                <th class="p-2 border">Loja</th>
                                <th class="p-2 border">Escala Aplicada</th>
                                <th class="p-2 border text-center">Horas Feitas</th>
                                <th class="p-2 border text-center text-blue-600">Horas Extras</th>
                            </tr>
                        </thead>
                        <tbody id="tbHoras" class="text-slate-700">
                            <tr><td colspan="5" class="p-4 text-center">Carregando dados...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
                    <h2 class="text-lg font-bold text-slate-700 border-b pb-2 mb-4">Relatório 2: Financeiro de Viagens</h2>
                    <table class="w-full text-sm text-left border-collapse">
                        <thead class="bg-slate-800 text-white">
                            <tr>
                                <th class="p-2 border">Data</th>
                                <th class="p-2 border">Loja</th>
                                <th class="p-2 border text-center">Extras (h)</th>
                                <th class="p-2 border text-right">Valor/Hora (R$)</th>
                                <th class="p-2 border text-right text-green-400">Total Previsto (R$)</th>
                            </tr>
                        </thead>
                        <tbody id="tbFinanceiro" class="text-slate-700">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Script Customizado Unificado -->
    <script src="script.js"></script>
</body>
</html>
